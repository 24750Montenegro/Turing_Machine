.mt-arista.activa path { stroke: #e8492c; stroke-width: 3; }
.mt-arista.activa text { fill: #c2341b; font-weight: 700; }
.mt-inicio { fill: none; stroke: #1b1b1f; stroke-width: 1.7; }
