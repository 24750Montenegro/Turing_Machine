---
# MT alteradora: w ∈ {a, b}* se convierte en wᴿ. La caché lleva el símbolo que se copia.
q_states:
  q_list:
  - 'q0'
  - 'q1'
  - 'q2'
  - 'q3'
  - 'q4'
  - 'q5'
  - 'q6'
  initial: 'q0'
  final: 'q6'
alphabet:
- a
- b
tape_alphabet:
- "#"
- X
-
delta:
# q0: ir al final de w y escribir #
- params:
    initial_state: 'q0'
    mem_cache_value:
    tape_input: a
  output:
    final_state: 'q0'
    mem_cache_value:
    tape_output: a
    tape_displacement: R
- params:
    initial_state: 'q0'
    mem_cache_value:
    tape_input: b
  output:
    final_state: 'q0'
    mem_cache_value:
    tape_output: b
    tape_displacement: R
- params:
    initial_state: 'q0'
    mem_cache_value:
    tape_input:
  output:
    final_state: 'q1'
    mem_cache_value:
    tape_output: "#"
    tape_displacement: L
# q1: tomar el último símbolo sin copiar
- params:
    initial_state: 'q1'
    mem_cache_value:
    tape_input: X
  output:
    final_state: 'q1'
    mem_cache_value:
    tape_output: X
    tape_displacement: L
- params:
    initial_state: 'q1'
    mem_cache_value:
    tape_input: a
  output:
    final_state: 'q2'
    mem_cache_value: a
    tape_output: X
    tape_displacement: R
- params:
    initial_state: 'q1'
    mem_cache_value:
    tape_input: b
  output:
    final_state: 'q2'
    mem_cache_value: b
    tape_output: X
    tape_displacement: R
- params:
    initial_state: 'q1'
    mem_cache_value:
    tape_input:
  output:
    final_state: 'q4'
    mem_cache_value:
    tape_output:
    tape_displacement: R
# q2: avanzar hasta # con el símbolo en caché
- params:
    initial_state: 'q2'
    mem_cache_value: a
    tape_input: X
  output:
    final_state: 'q2'
    mem_cache_value: a
    tape_output: X
    tape_displacement: R
- params:
    initial_state: 'q2'
    mem_cache_value: a
    tape_input: "#"
  output:
    final_state: 'q3'
    mem_cache_value: a
    tape_output: "#"
    tape_displacement: R
- params:
    initial_state: 'q2'
    mem_cache_value: b
    tape_input: X
  output:
    final_state: 'q2'
    mem_cache_value: b
    tape_output: X
    tape_displacement: R
- params:
    initial_state: 'q2'
    mem_cache_value: b
    tape_input: "#"
  output:
    final_state: 'q3'
    mem_cache_value: b
    tape_output: "#"
    tape_displacement: R
# q3: escribir la caché al final de la copia
- params:
    initial_state: 'q3'
    mem_cache_value: a
    tape_input: a
  output:
    final_state: 'q3'
    mem_cache_value: a
    tape_output: a
    tape_displacement: R
- params:
    initial_state: 'q3'
    mem_cache_value: a
    tape_input: b
  output:
    final_state: 'q3'
    mem_cache_value: a
    tape_output: b
    tape_displacement: R
- params:
    initial_state: 'q3'
    mem_cache_value: a
    tape_input:
  output:
    final_state: 'q5'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: 'q3'
    mem_cache_value: b
    tape_input: a
  output:
    final_state: 'q3'
    mem_cache_value: b
    tape_output: a
    tape_displacement: R
- params:
    initial_state: 'q3'
    mem_cache_value: b
    tape_input: b
  output:
    final_state: 'q3'
    mem_cache_value: b
    tape_output: b
    tape_displacement: R
- params:
    initial_state: 'q3'
    mem_cache_value: b
    tape_input:
  output:
    final_state: 'q5'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
# q5: regresar hasta #
- params:
    initial_state: 'q5'
    mem_cache_value:
    tape_input: a
  output:
    final_state: 'q5'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: 'q5'
    mem_cache_value:
    tape_input: b
  output:
    final_state: 'q5'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
- params:
    initial_state: 'q5'
    mem_cache_value:
    tape_input: "#"
  output:
    final_state: 'q1'
    mem_cache_value:
    tape_output: "#"
    tape_displacement: L
# q4: borrar las X y el separador
- params:
    initial_state: 'q4'
    mem_cache_value:
    tape_input: X
  output:
    final_state: 'q4'
    mem_cache_value:
    tape_output:
    tape_displacement: R
- params:
    initial_state: 'q4'
    mem_cache_value:
    tape_input: "#"
  output:
    final_state: 'q6'
    mem_cache_value:
    tape_output:
    tape_displacement: R
simulation_strings:
- abaab
- aabbb
- babbaa
- ababbb
